name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check (php -l) on every PHP file
        run: |
          php -v
          # _reference/ and modx-example are gitignored (not in the repo); node_modules excluded defensively.
          find . -name '*.php' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Client syntax check
        run: node --check client/index.js

      - name: Architecture and staging tests
        run: |
          python3 _build/test.architecture.py
          python3 _build/test.build-architecture.py
          python3 _build/test.endpoint-architecture.py
          python3 _build/test.modx2-php-compat.py
          python3 _build/test.migration-coverage.py
          python3 _build/test.release-staging.py

      - name: Modular core and platform mapping
        run: |
          php _build/test.modular-core.php
          php _build/test.platform-mapping.php

      - name: Release smoke runner shell syntax
        run: bash -n _build/release.smoke.sh

      - name: Release portability / secure defaults
        run: python3 _build/test.release-portability.py

      - name: Client/server action contract
        run: python3 _build/test.client-server-actions.py

      - name: Version consistency across shared, MODX 2 and MODX 3 metadata
        run: |
          MODX3_PKG=$(php -r "include '_build/build.config.php'; echo PKG_VERSION;")
          MODX2_PKG=$(php -r "include '_build/platform/modx2/overlay/_build/build.config.php'; echo PKG_VERSION;")
          NPM=$(node -p "require('./package.json').version")
          LOCK=$(node -p "require('./package-lock.json').version")
          MODX3_MODEL=$(php -r "require 'core/components/modxmcp/model/modxmcp.class.php'; echo modxMCP::VERSION;")
          MODX2_MODEL=$(php -r "require 'core/components/modxmcp/legacy/modx2/modxmcp.class.php'; echo modxMCP::VERSION;")
          echo "modx3=$MODX3_PKG  modx2=$MODX2_PKG  package.json=$NPM  package-lock.json=$LOCK  modx3-model=$MODX3_MODEL  modx2-model=$MODX2_MODEL"
          if [ "$MODX3_PKG" != "$NPM" ] || [ "$MODX2_PKG" != "$NPM" ] || [ "$NPM" != "$LOCK" ] || [ "$LOCK" != "$MODX3_MODEL" ] || [ "$MODX3_MODEL" != "$MODX2_MODEL" ]; then
            echo "::error::Version mismatch across shared / MODX 2 / MODX 3 release metadata"
            exit 1
          fi

      - name: English and Russian CHANGELOGs have the current version
        run: |
          PKG=$(php -r "include '_build/build.config.php'; echo PKG_VERSION;")
          for FILE in CHANGELOG.md CHANGELOG.ru.md; do
            if ! grep -q "## ${PKG} " "$FILE"; then
              echo "::error::$FILE has no '## ${PKG}' entry"
              exit 1
            fi
          done
          echo "Both CHANGELOG files have an entry for ${PKG}."


  modx3-processors:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modx_ref: [v3.2.2-pl, v3.2.4-pl, 3.x]
    steps:
      - uses: actions/checkout@v4

      - name: Check MODX 3 processor compatibility
        run: |
          git clone --depth 1 --branch "${{ matrix.modx_ref }}" https://github.com/modxcms/revolution.git "$RUNNER_TEMP/modx"
          php _build/test.modx3-processors.php "$RUNNER_TEMP/modx/core/src/Revolution/Processors"
